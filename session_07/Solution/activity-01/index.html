<!DOCTYPE html>
<html>
<body>

<h2>What Can JavaScript Do?</h2>

<p id="demo">JavaScript can change HTML content.</p>

<button type="button" onclick='myClick()'>Click Me!</button>

<script>

    let textHelloBool = false

    let products = [
        { name: "laptop", price: 800, discount: 0.1},
        { name: "phone", price:200, discount: 0.15},
        { name: "tv", price: 1200, discount: 0.5}
    ];

    let highestPrice = 0
    let mostExpensiveProduct = ''
    let discountedHighestPrice = 0

    products.forEach(function (productInfo, index){

        // here I have access to every single product
        console.log(productInfo.name, productInfo.price)

        if (productInfo.price > highestPrice){
            highestPrice = productInfo.price
            mostExpensiveProduct = productInfo.name
            discountedHighestPrice = productInfo.price - (productInfo.discount * productInfo.price)
        }

    })

    console.log(`highest price is ${highestPrice} for the brand new ${mostExpensiveProduct} but it's discounted to ${discountedHighestPrice}`)


    let sortedData = products.sort(function (a,b){
        return a.price - b.price
    })

    let filteredData = products.filter(function (dataElement, index){
        console.log(dataElement, index)
        // return dataElement.discount > 0.1
        return index < 2
    })


    console.log(filteredData)




    function myClick(){

        if (textHelloBool){
            textHelloBool = false // flip switch
            document.getElementById("demo").innerHTML = "JavaScript can change HTML content." // update the text
        } else {
            textHelloBool = true // flip switch
            document.getElementById("demo").innerHTML = "Hello JavaScript!"
        }
    }
</script>

</body>
</html>
